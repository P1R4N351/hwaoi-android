# One Gradle at a time per worktree and no daemon left behind: several agents build in parallel on a 24 GB Mac, and idle 3 GB daemons once ran it out of memory
org.gradle.daemon=false
org.gradle.jvmargs=-Xmx2g
android.useAndroidX=false
android.nonTransitiveRClass=true
# The game this APK runs (dm/games/<title ID>), compiled into its own host (libnxhost_<title ID>.so).
# Default: Hyrule Warriors: Age of Imprisonment (04003F40232DE000).
nxGames=04003F40232DE000
